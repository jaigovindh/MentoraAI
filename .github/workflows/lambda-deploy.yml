
name: MentoraAI Lambda CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "student-ai-lambda/**"
      - ".github/workflows/lambda-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "student-ai-lambda/**"
      - ".github/workflows/lambda-deploy.yml"

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-deploy:
    name: Validate and Deploy Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: student-ai-lambda/package-lock.json

      - name: Install production dependencies
        working-directory: student-ai-lambda
        run: npm ci --omit=dev

      - name: Validate Lambda syntax
        working-directory: student-ai-lambda
        run: node --check index.mjs

      - name: Package Lambda
        working-directory: student-ai-lambda
        run: |
          zip -r "$GITHUB_WORKSPACE/lambda-deployment.zip" \
            index.mjs \
            package.json \
            package-lock.json \
            node_modules

      - name: Configure AWS credentials through OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::282516655352:role/MentoraGitHubLambdaDeployRole
          aws-region: ap-southeast-2

      - name: Deploy Lambda code
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws lambda update-function-code \
            --function-name student-ai-test \
            --zip-file fileb://lambda-deployment.zip \
            --region ap-southeast-2
