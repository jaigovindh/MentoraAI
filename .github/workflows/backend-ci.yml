name: MentoraAI Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-backend:
    name: Validate Express Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: student-ai-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: student-ai-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check app/server.js

      - name: Check Lambda test syntax
        run: node --check lambda-test/index.js
